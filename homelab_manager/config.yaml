# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
# version tracks the hub release; packaging-only changes use a suffix (0.3.37-1).
name: Homelab Manager
version: "0.3.37-1"
slug: homelab_manager
description: Hub Homelab Manager autonome avec MongoDB pour Home Assistant OS
url: https://github.com/Mamath2000/homelab-manager-haos
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
timeout: 60
ports:
  3000/tcp: 3000
  3443/tcp: 3443
ports_description:
  3000/tcp: Interface web du hub
  3443/tcp: Connexion TLS des agents
webui: "http://[HOST]:[PORT:3000]"
watchdog: "http://[HOST]:[PORT:3000]/api/health"
map:
  - type: data
    read_only: false
image: ghcr.io/mamath2000/homelab-manager-haos
options:
  timezone: Europe/Paris
schema:
  timezone: str
