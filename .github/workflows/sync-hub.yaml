# Follows the latest Homelab Manager release and publishes its standalone HAOS app image.
name: Sync hub app

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Homelab Manager release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      hub_version: ${{ steps.check.outputs.hub_version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compare published hub version
        id: check
        run: |
          hub_version=$(curl -fsSL "https://hub.docker.com/v2/repositories/mathmath350/homelab-manager/tags?page_size=100" \
            | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          current=$(sed -n 's/^version: "\(.*\)"/\1/p' homelab_manager/config.yaml)
          [ -n "${hub_version}" ] || { echo "No stable hub release found" >&2; exit 1; }
          [ -n "${current}" ] || { echo "Could not read app version" >&2; exit 1; }
          echo "Homelab Manager ${hub_version}, app ${current}"
          if [ -n "${hub_version}" ] && [ "${hub_version}" != "${current%%-*}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${hub_version}" >> "$GITHUB_OUTPUT"
          echo "hub_version=${hub_version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/build_hub.yaml
    with:
      version: ${{ needs.check.outputs.version }}
      hub_version: ${{ needs.check.outputs.hub_version }}
      commit: true
