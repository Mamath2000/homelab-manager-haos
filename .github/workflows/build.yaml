# Builds and publishes the image of homelab_agent at its config.yaml version (tag skipped if it
# already exists), then writes that version and HM_VERSION in the repository when asked.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: App version (image tag, config.yaml)
        required: true
        type: string
      hm_version:
        description: homelab-manager release whose agent binary is shipped
        required: true
        type: string
      commit:
        description: Write version and HM_VERSION to the repository after the push
        required: false
        type: boolean
        default: false

env:
  APP: homelab_agent
  IMAGE_NAME: homelab-agent-haos
  ARCHITECTURES: '["amd64"]'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ghcr.io/mamath2000

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ env.APP }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ inputs.version }}
            latest
          build-args: |
            HM_VERSION=${{ inputs.hm_version }}
          labels: |
            io.hass.type=app
            io.hass.name=Homelab Manager Agent
            io.hass.url=https://github.com/Mamath2000/homelab-manager-haos
          push: "true"
          skip-existing: ${{ inputs.version }}
          version: ${{ inputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ inputs.version }}
            latest
          registry-prefix: ghcr.io/mamath2000
          skip-existing: ${{ inputs.version }}

  # after the image: Supervisor offers the update as soon as it reads the new version
  commit:
    name: Write version ${{ inputs.version }}
    needs: manifest
    if: inputs.commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Bump config.yaml, Dockerfile and CHANGELOG
        env:
          VERSION: ${{ inputs.version }}
          HM_VERSION: ${{ inputs.hm_version }}
        run: |
          sed -i "s/^version: .*/version: \"${VERSION}\"/" "${APP}/config.yaml"
          sed -i "s/^ARG HM_VERSION=.*/ARG HM_VERSION=${HM_VERSION}/" "${APP}/Dockerfile" "${APP}_dev/Dockerfile"
          {
            echo "## ${VERSION}"
            echo
            echo "- Agent ${VERSION}, image Homelab Manager ${HM_VERSION}"
            echo
            cat "${APP}/CHANGELOG.md"
          } > CHANGELOG.new && mv CHANGELOG.new "${APP}/CHANGELOG.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${APP}/config.yaml" "${APP}/Dockerfile" "${APP}_dev/Dockerfile" "${APP}/CHANGELOG.md"
          git commit -m "Agent ${VERSION} (Homelab Manager ${HM_VERSION})"
          git push
